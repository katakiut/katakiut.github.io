function daysAgo(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const then = new Date(y, m - 1, d);
  const now = new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  if (diff === 1) return "ayer";
  return `hace ${diff} días`;
